<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081f2b"><title>MYR5 · War Room</title>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
  <script src="/workout-tracks.js"></script><script src="/pod/gala-weapons.js"></script><script src="/pod/gala-avatar.js"></script><script src="/pod/gala-performer.js"></script>
  <script type="module" src="/war-room/war-room.mjs"></script>
<script type="module" src="/audio/standalone-sound.mjs"></script></head>
<body>
  <main class="war-room">
    <section class="panel character-bay" aria-labelledby="characterBayTitle">
      <div class="character-bay-head">
        <a href="/pose.html#portal" class="portal-link">← Portal</a>
        <h1 id="characterBayTitle">WAR ROOM</h1>
        <span id="access" role="status">Checking…</span>
        <p id="characterBayStatus" role="status" class="bay-status">Opening…</p>
      </div>
      <div id="warRoomGalaHost" class="character-bay-stage"></div>
    </section>

    <details class="panel controls-drawer">
      <summary>Controls</summary>
      <div class="controls-grid">
        <section aria-labelledby="clearanceTitle">
          <h2 id="clearanceTitle">Clearance</h2>
          <p id="runStatus" role="status">Loading…</p>
          <dl id="checks" class="checks"></dl>
        </section>
        <section aria-labelledby="identityTitle">
          <h2 id="identityTitle">Identity</h2>
          <p id="identity">No DJ identity.</p>
        </section>
        <section class="board" aria-labelledby="boardTitle">
          <div class="section-heading"><h2 id="boardTitle">Rankings</h2><button id="refresh" type="button">Refresh</button></div>
          <p id="boardStatus" role="status">Loading…</p>
          <table><thead><tr><th>Rank</th><th>DJ</th><th>Time</th></tr></thead><tbody id="leaderRows"></tbody></table>
        </section>
        <section class="arsenal" aria-labelledby="arsenalTitle">
          <h2 id="arsenalTitle">Arsenal</h2>
          <label>Weapon <select id="weaponType"><option value="rapier">Rapier</option><option value="greatsword">Greatsword</option><option value="dagger">Dagger</option><option value="sabre">Sabre</option><option value="axe">Axe</option><option value="hammer">Hammer</option><option value="mace">Mace</option><option value="flail">Flail</option><option value="spear">Spear</option><option value="trident">Trident</option><option value="halberd">Halberd</option><option value="scythe">Scythe</option><option value="bow">Bow</option><option value="crossbow">Crossbow</option><option value="chakram">Chakram</option><option value="gauntlets">Gauntlets</option><option value="staff">Staff</option><option value="wand">Wand</option><option value="tome">Tome</option><option value="cannon">Cannon</option></select></label>
          <label>Tier <input id="weaponTier" type="number" min="0" max="20" step="1"></label>
          <button id="saveLoadout" type="button">Save</button>
          <p id="arsenalStatus" role="status"></p>
        </section>
      </div>
    </details>
  </main>
  <!-- R20: the app's dock console and metal housing, as in the customizer -->
  <nav id="coachDock" class="coach-dock" aria-label="Coach tools"><a class="dock-control dock-settings" data-route="customizeCoach" href="/pose.html#customizeCoach" aria-label="Customize coach" title="Customize coach"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></span></a><a class="dock-control dock-food" data-route="food" href="/pose.html#food" aria-label="Food" title="Food"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></span></a><a class="dock-portal" data-route="portal" href="/pose.html" aria-label="Portal or workout pod" title="Portal or workout pod"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-6h4v6"/></svg><span aria-hidden="true">PORTAL</span></a><a class="dock-control dock-scoreboard" data-route="scoreboard" href="/pose.html#scoreboard" aria-label="Classroom leaderboard" title="Classroom leaderboard"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3 0 6 1.5 6 5"/></svg></span></a><a class="dock-control dock-achievements" data-route="achievements" href="/pose.html#achievements" aria-label="Achievements" title="Achievements"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H3c0 3 1 4 4 4M17 6h4c0 3-1 4-4 4M12 14v4M8 21h8"/></svg></span></a><a class="dock-control dock-pod" data-route="reminders" href="/pose.html#reminders" aria-label="Reminders computer" title="Reminders computer"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span></a><span class="dock-live" role="status" aria-live="polite"></span></nav>
  <script type="module">import{mountStandaloneHousing}from'/modules/portal/standalone-housing.mjs';await mountStandaloneHousing({content:document.querySelector('.war-room')});</script>
</body>
</html>
