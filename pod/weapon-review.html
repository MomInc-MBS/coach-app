<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex"><title>Weapon lab · MYR5</title>
  <link rel="stylesheet" href="weapon-review.css">
</head>
<body>
  <main>
    <header><a href="../pose.html">MYR5</a><h1>Weapon lab</h1><span>Animation preview</span></header>
    <div class="workspace">
      <nav aria-label="Weapons" id="families"></nav>
      <section class="preview" aria-label="Weapon preview">
        <div class="stage">
          <div class="stage-title"><div><span id="tierLabel"></span><h2 id="weaponName"></h2></div><span id="tierNumber"></span></div>
          <canvas id="scene" width="640" height="360" aria-label="Animated weapon demonstration"></canvas>
          <span class="preview-badge">All tiers available here for review</span>
        </div>
        <div class="controls">
          <div class="tier-control"><label for="tier">Tier</label><input id="tier" type="range" min="0" max="20" value="4"><output id="tierOutput" for="tier">4</output></div>
          <div class="action-controls"><button id="attack">Attack</button><button id="special" class="special">Special</button><button id="autoplay" aria-pressed="false">Autoplay</button></div>
          <progress id="cooldown" max="1" value="1" aria-label="Special ability ready"></progress>
          <div class="details"><span id="unlock"></span><span id="abilityInfo"></span></div>
        </div>
        <section class="comparison" aria-label="Tier comparison">
          <figure><canvas width="320" height="180"></canvas><figcaption>Field · tier 0</figcaption></figure>
          <figure><canvas width="320" height="180"></canvas><figcaption id="previousLabel"></figcaption></figure>
          <figure><canvas width="320" height="180"></canvas><figcaption id="currentLabel"></figcaption></figure>
        </section>
        <p class="motion-note" id="motionNote" hidden>Reduced motion is on.</p>
        <div id="status" role="status" aria-live="polite" class="sr-only"></div>
      </section>
    </div>
  </main>
  <script src="/workout-tracks.js"></script><script src="gala-weapons.js"></script>
  <script type="module" src="weapon-review.mjs"></script>
</body>
</html>
